name: Cloud alerts

on:
  # Triggered every 15 minutes by the Cloudflare Worker in
  # cloudflare/alert-scheduler. GitHub's native scheduler is best-effort and
  # was observed skipping hours, so it is intentionally not used here.
  workflow_dispatch:
    inputs:
      test:
        description: Send a test notification instead of checking forecasts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloud-alerts
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: atc-notify-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            atc-notify-

      - name: Check the forecast and send alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_URL: ${{ vars.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ATC_LOCATIONS: ${{ vars.ATC_LOCATIONS }}
          ATC_APP_URL: ${{ vars.ATC_APP_URL }}
          ATC_THRESHOLD: ${{ vars.ATC_THRESHOLD }}
          ATC_HORIZON_HOURS: ${{ vars.ATC_HORIZON_HOURS }}
          ATC_TEST: ${{ inputs.test }}
        run: node scripts/check-and-notify.mjs

      - name: Save alert state
        if: always() && hashFiles('.state/notified.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .state
          key: atc-notify-${{ github.run_id }}-${{ github.run_attempt }}
